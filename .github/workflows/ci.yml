name: Moodle plugin CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  test:
    runs-on: ubuntu-22.04

    # The main branch job is an early warning about upstream change, not a
    # release gate: the plugin declares support up to Moodle 5.0, so validate
    # legitimately objects once main moves beyond it.
    continue-on-error: ${{ matrix.moodle-branch == 'main' }}

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
          MYSQL_COLLATION_SERVER: 'utf8mb4_bin'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        moodle-branch: ['MOODLE_405_STABLE', 'main']
        database: ['pgsql', 'mariadb']
        exclude:
          # Moodle main declares "php": ">=8.3.0" in composer.json, and its lock
          # file pins lcobucci/clock ~8.3.0||~8.4.0||~8.5.0 and
          # maennchen/zipstream-php ^8.3. Composer therefore cannot resolve that
          # branch on PHP 8.2, so the combination is impossible rather than
          # failing. Moodle 4.5 keeps both PHP versions: its own composer.json
          # requires only >=8.1.0.
          - php: '8.2'
            moodle-branch: 'main'

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, gd, zip, soap, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Install Arabic language pack
        run: |
          php <<'PHP'
          <?php
          define('CLI_SCRIPT', true);

          require_once(getcwd() . '/moodle/config.php');

          get_string_manager()->reset_caches();
          core_php_time_limit::raise();

          $controller = new tool_langimport\controller();
          $langpackurl = $controller->lang_pack_url('ar');
          echo "Installing Arabic language pack from Moodle language import URL: {$langpackurl}\n";

          $result = $controller->install_languagepacks('ar');
          get_string_manager()->reset_caches();

          foreach ($controller->info as $message) {
              echo $message . "\n";
          }

          if ($result === false || !empty($controller->errors)) {
              foreach ($controller->errors as $message) {
                  fwrite(STDERR, $message . "\n");
              }
              exit(1);
          }
          PHP

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --dump

      - name: Asset budget
        if: ${{ !cancelled() }}
        run: |
          CSS=$(wc -c < plugin/styles.css)
          JS=$(cat plugin/amd/build/*.min.js | wc -c)
          echo "styles.css: $CSS bytes (budget 12288)"
          echo "amd build: $JS bytes (budget 8192)"
          test "$CSS" -le 12288
          test "$JS" -le 8192

      - name: Right to left CSS audit
        if: ${{ !cancelled() }}
        run: |
          ! grep -nE '^[[:space:]]*(left|right|margin-left|margin-right|padding-left|padding-right|border-left|border-right)[[:space:]]*:' plugin/styles.css
